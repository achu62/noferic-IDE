<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "JetBrains Mono", monospace;
      background: #1e1e1e;
      color: #eeeeee;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

    textarea {
      display: block;
      width: 100%;
      height: 100%;
      padding: 12px 16px;
      resize: none;
      border: 0;
      outline: 0;
      background: #1e1e1e;
      color: #d4d4d4;
      font: 13px/1.6 "JetBrains Mono", monospace;
      tab-size: 2;
      white-space: pre;
    }

    html[data-theme="light"] { color-scheme: light; background: #fff; }
    html[data-theme="light"] textarea { background: #fff; color: #242424; }
  </style>
</head>
<body>
  <textarea id="source" aria-label="Code editor" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  <script type="module" src="./editor.js"></script>
</body>
</html>
