<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Monaco IDE</title>
  <style>
    @font-face {
      font-family: "JetBrains Mono";
      src: url("./fonts/JetBrainsMono/fonts/variable/JetBrainsMono[wght].ttf") format("truetype");
      font-weight: 100 800;
      font-style: normal;
    }

    @font-face {
      font-family: "JetBrains Mono";
      src: url("fonts/JetBrainsMono/fonts/webfonts/JetBrainsMono-Italic.woff2") format("woff2");
      font-weight: 400;
      font-style: italic;
    }

    @font-face {
      font-family: "JetBrains Mono";
      src: url("fonts/JetBrainsMono/fonts/webfonts/JetBrainsMono-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
    }

    @font-face {
      font-family: "JetBrains Mono";
      src: url("fonts/JetBrainsMono/fonts/webfonts/JetBrainsMono-BoldItalic.woff2") format("woff2");
      font-weight: 700;
      font-style: italic;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "JetBrains Mono", monospace !important;

      font-feature-settings: 'liga' 1;
    }

    #editor {
      position: fixed;
      inset: 0;
      width: auto;
      height: auto;
      pointer-events: auto;
    }
  </style>
</head>

<body>
  <div id="editor"></div>
  <script src="monaco-editor/package/min/vs/loader.js"></script>
  <script src="script.js" type="module">

  </script>
  <script src="./CreateEditor.js" type="module"></script>

</body>

</html>
